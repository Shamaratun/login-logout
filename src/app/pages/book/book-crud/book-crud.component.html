<div class="row p-2">
  <div class="col-md-8 mx-auto">
    <h2 class="form-title text-primary text-center mb-4">
      {{ isUpdate ? 'Update Book' : 'Add New Book' }}
    </h2>

    <div class="container shadow-lg p-4 bg-white rounded">
      <form (ngSubmit)="onSubmit()">
        <!-- Title -->
        <div class="mb-3">
          <label for="title" class="form-label">Title:</label>
          <input type="text" id="title" [(ngModel)]="book.title" name="title" required class="form-control"
            placeholder="Enter book title" />
        </div>

        <!-- ISBN -->
        <div class="mb-3">
          <label for="isbn" class="form-label">ISBN:</label>
          <input type="text" id="isbn" [(ngModel)]="book.isbn" name="isbn" required class="form-control"
            placeholder="Enter ISBN" />
        </div>

        <!-- Price -->
        <div class="mb-3">
          <label for="price" class="form-label">Price:</label>
          <input type="number" id="price" [(ngModel)]="book.price" name="price" required class="form-control"
            placeholder="Enter price" min="0" />
        </div>

        <!-- Stock -->
        <div class="mb-3">
          <label for="stock" class="form-label">Stock:</label>
            <select name="stock"  required style="width: 100%;">
   
       <option *ngFor="let warehouse of warehouses" [value]="warehouse.warehouseId">
    {{ warehouse.stockLevel }}
    </option>
  </select><br />
        </div>
  
        <!-- Image -->
        <div class="mb-3">
          <label for="image" class="form-label">Image URL:</label>
          <input type="text" id="image" [(ngModel)]="book.image" name="image" class="form-control"
            placeholder="Enter image URL" />
        </div>

        <!-- Genre -->
        <div class="mb-3">
          <label for="genre" class="form-label">Genre:</label>
          <select id="genre" [(ngModel)]="book.genre" name="genre" required class="form-select">
            <option value="" disabled selected>Select genre</option>
            <option *ngFor="let g of genres" [value]="g">{{ g }}</option>
          </select>
        </div>

        <!-- Rating -->
        <div class="mb-3">
          <label for="rating" class="form-label">Rating:</label>
          <input type="number" id="rating" [(ngModel)]="book.rating" name="rating" class="form-control"
            placeholder="Enter rating (1–5)" min="1" max="5" />
        </div>

        <!-- Author -->
        <div class="mb-3">
          <label for="author" class="form-label">Author:</label>
          <select id="author"  [(ngModel)]="book.authorId" name="author" required class="form-select">
            <option value="" disabled selected>Select author</option>
            <option *ngFor="let author of authors" [value]="author.authorId">
    {{ author.name }}
  </option>
          </select>
        </div>

        <!-- Warehouse -->
        <div class="mb-3">
          <label for="warehouse" class="form-label">Warehouse:</label>
          <select id="warehouse" [(ngModel)]="book.warehouseId"name="warehouse" required class="form-select">
            <option value="" disabled selected>Select warehouse</option>
           <option *ngFor="let warehouse of warehouses" [value]="warehouse.warehouseId">
    {{ warehouse.location }}
          </select>
        </div>

        <!-- Submit -->
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">
            {{ isUpdate ? 'Update Book' : 'Add Book' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="container mt-4">
  <h2 class="text-center text-primary mb-4">Book List</h2>

  <table class="table table-striped table-bordered table-hover shadow-sm">
    <thead class="table-dark">
      <tr>
        <th>#</th>
        <th>Title</th>
        <th>ISBN</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Image</th>
        <th>Genre</th>
        <th>Rating</th>
        <th>Author</th>
        <th>Warehouse</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let book of books; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ book.title }}</td>
        <td>{{ book.isbn }}</td>
        <td>{{ book.price }}</td>
        <td>{{ book.stock }}</td>
        <td>
          <img [src]="book.image" alt="{{ book.title }}" width="50" height="60" class="rounded" *ngIf="book.image" />
        </td>
        <td>{{ book.genre }}</td>
        <td>{{ book.rating }}/5</td>
        <td>{{ book.authorId }}</td>
        <td>{{ book.warehouseId }}</td>
        <td>
          <button class="btn btn-sm btn-primary me-2" (click)="editBook(book)">Edit</button>
          <button class="btn btn-sm btn-danger" (click)="deleteBook(book)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
