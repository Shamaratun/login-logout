<div class="container mt-4">
  <h2 class="text-center">User List</h2>
  <table class="table table-bordered table-hover table-striped">
    <thead class="table-primary">
      <tr>
        <th>#</th>
       
        <th>Address</th>
        <th>Email</th>
        <th>Full Name</th>
        <th>NID</th>
      
        <th>Phone Number</th>
        <th>Role</th>
        <th>Username</th>
        <th>Created At</th>
        <th>Updated At</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users; let i = index; trackBy: trackByUserId">
        <td>{{ i + 1 }}</td>
       
        <td>{{ user.address }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.fullName }}</td>
        <td>{{ user.nid }}</td>
       
        <td>{{ user.phoneNumber }}</td>
        <td>{{ user.role }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.createdAt }}</td>
        <td>{{ user.updatedAt }}</td>
        <td>
          <button class="btn btn-outline-info btn-sm" (click)="editUser(user)">Edit</button>
          <button class="btn btn-outline-danger btn-sm" (click)="deleteUser(user)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
