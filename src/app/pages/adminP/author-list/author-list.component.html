<div class="row p-2">
  <!-- Form Section -->
  <div class="col-md-6">
    <h1 class="form-title text-primary text-center">Add / Update Author</h1>
    <div class="container shadow-lg p-4 bg-white rounded">
      <form (ngSubmit)="onSubmit()">
        <!-- Name -->
        <div class="mb-3">
          <label for="name" class="form-label">Name:</label>
          <input type="text" id="name" [(ngModel)]="author.name" name="name" required class="form-control"
            placeholder="Enter author's name" />
        </div>

        <!-- Bio -->
        <div class="mb-3">
          <label for="bio" class="form-label">Bio:</label>
          <input type="text" id="bio" [(ngModel)]="author.bio" name="bio" required class="form-control"
            placeholder="Enter author's biography" />
        </div>

        <!-- Country -->
        <div class="mb-3">
          <label for="country" class="form-label">Country:</label>
          <input type="text" id="country" [(ngModel)]="author.country" name="country" required class="form-control"
            placeholder="Enter author's country" />
        </div>

        <!-- Date of Birth -->
        <div class="mb-3">
          <label for="dob" class="form-label">Date of Birth:</label>
          <input type="date" id="dob" [(ngModel)]="author.dob" name="dob" class="form-control" required />
        </div>

        <!-- Submit Button -->
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">
            {{ isUpdate ? 'Update Author' : 'Add Author' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Table to View Authors List -->
<h1 class="form-title text-center my-4">List of Authors</h1>

<div class="container">
  <table class="table table-bordered table-hover text-center align-middle">
    <thead class="table-dark">
      <tr>
        <th scope="col">#</th>
        <th scope="col">Name</th>
        <th scope="col">Bio</th>
        <th scope="col">Country</th>
        <th scope="col">Date of Birth</th>
        <th scope="col">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let author of authors; let i = index; trackBy: trackById">
        <td>{{ i + 1 }}</td>
        <td>{{ author.name }}</td>
        <td>{{ author.bio }}</td>
        <td>{{ author.country }}</td>
        <td>{{ author.dob }}</td>
        <td>
          <button class="btn btn-sm btn-warning me-1" (click)="editAuthor(author)">Edit</button>
          <button class="btn btn-sm btn-danger" (click)="deleteAuthor(author)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
