<!-- warehouse-list.component.html -->
<div class="warehouse-container">
  <h2>Warehouse List</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Location</th>
        <th>Stock Level</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let warehouse of warehouses">
        <td>{{ warehouse.warehouseID }}</td>
        <td>{{ warehouse.location }}</td>
        <td>{{ warehouse.stockLevel }}</td>
      </tr>
    </tbody>
  </table>
</div>
