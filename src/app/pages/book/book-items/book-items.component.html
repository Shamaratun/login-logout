 @if (userRole === 'patient'){<div class="row p-2">
  <!-- Form Section -->
  <div class="col-md-6">
    <h1 class="form-title text-primary text-center">Add / Update Book</h1>
    <div class="container shadow-lg p-4 bg-white rounded">
      <form (ngSubmit)="onSubmit()">
        <!-- Title -->
        <div class="mb-3">
          <label for="title" class="form-label">Title:</label>
          <input type="text" id="title" [(ngModel)]="book.title" name="title" required class="form-control"
            placeholder="Enter book title" />
        </div>

        <!-- ISBN -->
        <div class="mb-3">
          <label for="isbn" class="form-label">ISBN:</label>
          <input type="text" id="isbn" [(ngModel)]="book.isbn" name="isbn" required class="form-control"
            placeholder="Enter ISBN number" />
        </div>

        <!-- Price -->
        <div class="mb-3">
          <label for="price" class="form-label">Price:</label>
          <input type="number" id="price" [(ngModel)]="book.price" name="price" required class="form-control"
            placeholder="Enter price" min="0" />
        </div>

        <!-- Stock -->
        <div class="mb-3">
          <label for="stock" class="form-label">Stock:</label>
          <input type="number" id="stock" [(ngModel)]="book.stock" name="stock" required class="form-control"
            placeholder="Enter available stock" min="0" />
        </div>

        <!-- Image -->
        <div class="mb-3">
          <label for="image" class="form-label">Image URL:</label>
          <input type="text" id="image" [(ngModel)]="book.image" name="image" class="form-control"
            placeholder="Enter image URL" />
        </div>

        <!-- Genre -->
        <div class="mb-3">
          <label for="genre" class="form-label">Genre:</label>
          <input type="text" id="genre" [(ngModel)]="book.genre" name="genre" class="form-control"
            placeholder="Enter genre" />
        </div>

        <!-- Rating -->
        <div class="mb-3">
          <label for="rating" class="form-label">Rating:</label>
          <input type="number" id="rating" [(ngModel)]="book.rating" name="rating" class="form-control"
            placeholder="Enter rating (1–5)" min="1" max="5" />
        </div>

        <!-- Submit Button -->
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">
            {{ isUpdate ? 'Update Book' : 'Add Book' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
}

<!-- Table to View Books List -->
<h1 class="form-title text-center my-4">List of Books</h1>

<div class="container">
  <table class="table table-bordered table-hover text-center align-middle">
    <thead class="table-dark">
      <tr>
        <th scope="col">#</th>
        <th scope="col">Title</th>
        <th scope="col">ISBN</th>
        <th scope="col">Price</th>
        <th scope="col">Stock</th>
        <th scope="col">Image</th>
        <th scope="col">Genre</th>
        <th scope="col">Rating</th>
        <th scope="col">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let book of books; let i = index; trackBy: trackById">
        <td>{{ i + 1 }}</td>
        <td>{{ book.title }}</td>
        <td>{{ book.isbn }}</td>
        <td>{{ book.price  }}</td>
        <td>{{ book.stock }}</td>
        <td>
          <img *ngIf="book.image" [src]="book.image" alt="Book Image" class="img-thumbnail" style="max-width: 60px;" />
        </td>
        <td>{{ book.genre }}</td>
        <td>{{ book.rating }}</td>
         @if (userRole === 'patient'){
        <td>
          
          <button class="btn btn-sm btn-warning me-1" (click)="editBook(book)">Edit</button>
          <button class="btn btn-sm btn-danger" (click)="deleteBook(book)">Delete</button>
        </td>
      }
      </tr>
    </tbody>
  </table>
</div>
