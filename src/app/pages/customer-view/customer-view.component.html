<div class="customer-view ,bg-image">
    <h2>Customer Resources</h2>
<app-customer-header></app-customer-header>
    <div *ngIf="resourceKeys.length > 0; else noData">
        <ul>
            <li *ngFor="let key of resourceKeys">
                <strong>{{ key }}:</strong> {{ resources[key] }}
            </li>
        </ul>
    </div>

    <ng-template #noData>
     
    </ng-template>
</div>
