<div class="common">
    Welcome All Roles!
    
    <ng-container *ngIf="role === 'admin'">
        <p>Admin Panel</p>
        <p>Customer Panel</p>
        <p>Viewer Panel</p>
    </ng-container>
    
    <ng-container *ngIf="role !== 'admin'">
        <p *ngIf="role === 'customer'">Customer Panel</p>
        <p *ngIf="role === 'viewer'">Viewer Panel</p>
    </ng-container>
    
    <!-- <router-outlet></router-outlet> -->
</div>
